name: simplifica-conquista
services:
  dominio:
    image: simplifica-conquista:local
    build: .
    command: ["uvicorn", "app.api_dominio:app", "--host", "0.0.0.0", "--port", "8001"]
    networks: [interno]
    volumes:
      - sqlite:/data/sqlite
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
  mcp:
    image: simplifica-conquista:local
    build: .
    command: ["python", "-m", "app.mcp"]
    environment:
      DOMINIO_URL: http://dominio:8001
    networks: [interno]
    depends_on:
      dominio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
  web:
    image: simplifica-conquista:local
    build: .
    command: ["uvicorn", "app.web:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_ASSISTANT_MODEL: ${GEMINI_ASSISTANT_MODEL:-gemini-3.5-flash-lite}
      GEMINI_JUDGE_MODEL: ${GEMINI_JUDGE_MODEL:-gemini-3.1-flash-lite}
      MCP_URL: http://mcp:8000/mcp
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    volumes:
      - chroma:/data/chroma
      - modelos:/data/modelos
    networks: [interno, default]
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
networks:
  interno:
    internal: true
volumes:
  sqlite:
  chroma:
  modelos:
